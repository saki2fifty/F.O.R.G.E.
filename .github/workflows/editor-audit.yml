name: Editor source audit
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      baseline_source_run:
        type: string
        default: ""
      performance_source_run:
        type: string
        default: ""
      workflow_only:
        type: boolean
        default: false
      clean_build:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source_commit:
        description: Immutable source revision to render (audit only, no release)
        type: string
        required: true
        default: 8bfaa4057660286dd503bd9fc62265dc350a7a84
      baseline_source_run:
        type: string
        default: ""
      performance_source_run:
        type: string
        default: ""
      workflow_only:
        type: boolean
        default: false
      clean_build:
        description: Ignore compatible build cache
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: editor-source-audit-${{ github.ref }}-${{ inputs.performance_source_run }}
  cancel-in-progress: false
jobs:
  editor:
    if: inputs.performance_source_run == ''
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      FORGE_BUILD_ID: unassigned
      FORGE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: runner.os != 'Windows'
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ inputs.source_commit }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          if ($env:FORGE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'A full immutable source commit is required' }
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Check native developer launcher
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: cmd
        run: tools\Run-Forge-Dev.cmd --check
      - name: Prepare cache workspace path
        id: cache-workspace
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $preload = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE/tools/cache_workspace.cjs'
          "preload=$($preload.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Identify compatible Windows build cache
        id: cache-key
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_cache_key.py
      - name: Restore Windows dependencies and build outputs
        id: editor-cache
        continue-on-error: true
        if: ${{ !inputs.clean_build }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-${{ inputs.source_commit }}
          restore-keys: |
            ${{ steps.cache-key.outputs.key }}-
      - name: Discard an incomplete cache restore
        if: ${{ !inputs.clean_build && (steps.editor-cache.outcome == 'failure' || steps.editor-cache.outputs.cache-matched-key == '') }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          foreach ($directory in @('b', 'd')) {
            $cachePath = Join-Path $env:RUNNER_TEMP "forge-work/AgentFiles/$directory"
            if (Test-Path $cachePath) { Remove-Item -LiteralPath $cachePath -Recurse -Force }
          }
      - name: Restore timestamps of content-identical cached sources
        if: ${{ !inputs.clean_build }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_source_stamps.py restore ../AgentFiles/b/forge-source-stamps.json
      - name: Clear previous audit evidence from the build cache
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          foreach ($relative in @('grid-test-images', 'Testing/Temporary/LastTest.log', 'Testing/Temporary/LastTestsFailed.log')) {
            $output = Join-Path '../AgentFiles/b' $relative
            if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          }
      - name: Prepare matched WARP benchmark target
        if: ${{ !inputs.workflow_only }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/prepare_editor_benchmark.py . ../AgentFiles/benchmark-target
      - id: configure
        run: cmake --preset windows-editor -B ../AgentFiles/b -DFETCHCONTENT_BASE_DIR:PATH="${{ runner.temp }}/forge-work/AgentFiles/d" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_PROJECT_INCLUDE:FILEPATH="${{ !inputs.workflow_only && format('{0}/forge-work/AgentFiles/benchmark-target/inject.cmake', runner.temp) || '' }}" -DFORGE_BUILD_ID="$env:FORGE_BUILD_ID" -DFORGE_SOURCE_COMMIT="$env:FORGE_SOURCE_COMMIT"
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Build input-driven editor fixture
        if: inputs.workflow_only
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: cmake --build ../AgentFiles/b --target forge_editor_fixture --parallel 2
      - name: Build actual editor with audit fixture
        if: ${{ !inputs.workflow_only }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: cmake --build ../AgentFiles/b --target forge_asset_worker_tests forge_asset_worker_fixture forge_gltf_animation_tests forge_draw_fallback_tests forge_cache_maintenance_tests forge_asset_scale_tests forge_runtime_package_tests forge_authored_schema_tests forge_authored_component_tests forge_authored_migration_tests forge_authored_components_editor_tests forge_render_bounds_tests forge_shader_tests forge_shader_pipeline_tests forge_shader_worker_tests forge_shader_editor_tests forge_editor_tests forge_fault_runtime forge_editor_fixture forge_tools forge_viewport_tests forge_mesh_asset_tests forge_material_asset_tests forge_material_pipeline_tests forge_material_editor_tests forge_content_files_tests forge_source_copy_tests forge_texture_asset_tests forge_texture_import_tests forge_texture_ktx_tests forge_texture_dds_tests forge_texture_bmp_tests forge_texture_webp_tests forge_texture_pipeline_tests forge_texture_bundle_tests forge_texture_editor_tests forge_model_editor_tests forge_asset_import_service_tests forge_asset_discovery_tests forge_asset_file_transaction_tests forge_asset_file_operations_tests forge_gltf_source_tests forge_asset_build_worker forge_resource_tests forge_asset_publication_tests forge_asset_robustness_tests forge_gltf_official_corpus_tests forge_gltf_official_tests forge_mesh_processing_tests forge_gltf_meshopt_tests forge_gltf_draco_tests forge_gltf_surfaces_tests forge_gltf_snapshot_tests forge_model_bundle_tests forge_model_pipeline_tests forge_audio_asset_tests forge_ui_asset_catalog_tests forge_ui_catalog_presenter_tests forge_runtime_ui_tests forge_ui_presenter_tests forge_runtime forge_model_scene_tests forge_gltf_ozz_tests forge_morph_animation_tests gltf2ozz forge_gltf_mesh_tests --parallel 2
      - name: Execute actual editor input and capture workflow
        if: inputs.workflow_only
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: ctest --test-dir ../AgentFiles/b -R "^editor_input_workflow$" --output-on-failure
      - name: Render fresh reset-layout evidence
        if: ${{ !inputs.workflow_only }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: ctest --test-dir ../AgentFiles/b -R "^(asset_worker_policy|audio_recipe|audio_pipeline|audio_tools|ui_asset_catalog|ui_catalog_presenter|runtime_ui|ui_presenter|draw_fallbacks|cache_maintenance|asset_scale_workloads|runtime_content_package|authored_schema|authored_component|authored_migration|authored_components_editor|render_bounds|shader_assets|shader_pipeline|shader_worker|shader_editor|editor_process_and_scale|editor_redesign_render|editor_input_workflow|editor_viewport_render|editor_render_morph|editor_render_skin|editor_render_frame|editor_render_optics|mesh_asset|material_asset|material_pipeline|material_editor|content_files|source_copy|texture_asset|texture_import|texture_ktx|texture_dds|texture_bmp|texture_webp|texture_recipe|texture_pipeline|texture_bundle|texture_tools|texture_editor|model_editor|asset_import_service|asset_discovery|asset_file_transaction|asset_file_operations|gltf_source|gltf_animation_admission|resource_lifetime|asset_publication|asset_robustness_corpus|gltf_official_corpus|gltf_official_negative_scale|mesh_processing|gltf_meshopt|gltf_draco|gltf_surfaces|gltf_snapshot|model_bundle|model_scene|gltf_ozz|morph_animation|model_recipe|model_pipeline|model_tools|model_animation_process|gltf_mesh_processing)$" --output-on-failure
      - name: Record exact source and audit identity
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:FORGE_SOURCE_COMMIT) { throw 'Source mismatch' }
          New-Item -ItemType Directory -Force ../AgentFiles/b/grid-test-images/editor | Out-Null
          @{ workflow_only = '${{ inputs.workflow_only }}'; source_commit = $actual } | ConvertTo-Json | Out-File ../AgentFiles/b/grid-test-images/audit-scope.json
          Copy-Item ../AgentFiles/b/build.json ../AgentFiles/b/grid-test-images/editor/audit-build.json
          $actual | Out-File ../AgentFiles/b/grid-test-images/editor/source-commit.txt
      - name: Build and stage current benchmark executable
        if: ${{ !inputs.workflow_only }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          cmake --build ../AgentFiles/b --target forge_editor_benchmark --parallel 2
          if ($LASTEXITCODE) { throw 'Benchmark build failed' }
          $out='../AgentFiles/benchmark-current'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item ../AgentFiles/b/*.exe,../AgentFiles/b/*.dll $out
          Copy-Item resources "$out/resources" -Recurse -Force
          Copy-Item ../AgentFiles/benchmark-target/provenance.json $out
      - name: Retain current benchmark executable
        if: ${{ !inputs.workflow_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Editor-Benchmark-current
          path: ${{ runner.temp }}/forge-work/AgentFiles/benchmark-current
      - name: Remove benchmark-only CMake injection before caching
        if: ${{ always() && steps.configure.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: cmake -S . -B ../AgentFiles/b -DCMAKE_PROJECT_INCLUDE:FILEPATH=
      - name: Record source content and input timestamps for incremental reuse
        if: ${{ always() && !inputs.clean_build && steps.configure.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_source_stamps.py record ../AgentFiles/b/forge-source-stamps.json
      - name: Save validated unnumbered audit build cache
        continue-on-error: true
        if: ${{ !inputs.clean_build && steps.editor-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-${{ inputs.source_commit }}
      - name: Preserve partial compilation for the next corrected-source audit
        # Cached object files are never validation evidence. Every restore still
        # reconfigures, builds all selected targets and executes their tests.
        continue-on-error: true
        if: ${{ failure() && !inputs.clean_build && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-partial-${{ inputs.source_commit }}
      - name: Upload fresh audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Editor-Source-Audit
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b/grid-test-images
            ${{ runner.temp }}/forge-work/AgentFiles/b/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 14

  benchmark-baseline:
    if: ${{ !inputs.workflow_only && inputs.baseline_source_run == '' }}
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      FORGE_BUILD_ID: unassigned
      FORGE_SOURCE_COMMIT: a98be9a672394d3d91c2b9067331d0252f9b4313
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: runner.os != 'Windows'
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: a98be9a672394d3d91c2b9067331d0252f9b4313
          FORGE_TOKEN: ${{ github.token }}
        run: |
          if ($env:FORGE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'A full immutable source commit is required' }
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
          $driver=Join-Path $env:RUNNER_TEMP 'forge-work/AgentFiles/benchmark-driver'
          New-Item -ItemType Directory -Force $driver | Out-Null
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin ${{ github.sha }}
          if ($LASTEXITCODE) { throw 'Cannot retrieve benchmark driver' }
          git -C $source show 'FETCH_HEAD:tools/prepare_editor_benchmark.py' | Set-Content "$driver/prepare_editor_benchmark.py" -Encoding utf8

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Check native developer launcher
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: cmd
        run: tools\Run-Forge-Dev.cmd --check
      - name: Prepare cache workspace path
        id: cache-workspace
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $preload = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE/tools/cache_workspace.cjs'
          "preload=$($preload.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Identify compatible Windows build cache
        id: cache-key
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_cache_key.py
      - name: Restore Windows dependencies and build outputs
        id: editor-cache
        continue-on-error: true
        if: ${{ !inputs.clean_build }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-a98be9a672394d3d91c2b9067331d0252f9b4313
          restore-keys: |
            ${{ steps.cache-key.outputs.key }}-
      - name: Discard an incomplete cache restore
        if: ${{ !inputs.clean_build && (steps.editor-cache.outcome == 'failure' || steps.editor-cache.outputs.cache-matched-key == '') }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          foreach ($directory in @('b', 'd')) {
            $cachePath = Join-Path $env:RUNNER_TEMP "forge-work/AgentFiles/$directory"
            if (Test-Path $cachePath) { Remove-Item -LiteralPath $cachePath -Recurse -Force }
          }
      - name: Restore timestamps of content-identical cached sources
        if: ${{ !inputs.clean_build }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          if (Test-Path tools/ci_source_stamps.py) {
            python tools/ci_source_stamps.py restore ../AgentFiles/b/forge-source-stamps.json
            if ($LASTEXITCODE) { throw 'Source-stamp restore failed' }
          }
      - name: Prepare accepted baseline WARP benchmark
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python ../AgentFiles/benchmark-driver/prepare_editor_benchmark.py . ../AgentFiles/benchmark-target
      - name: Build accepted baseline with matched adapter
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          cmake --preset windows-editor -B ../AgentFiles/b -DFETCHCONTENT_BASE_DIR:PATH="${{ runner.temp }}/forge-work/AgentFiles/d" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_PROJECT_INCLUDE:FILEPATH="${{ runner.temp }}/forge-work/AgentFiles/benchmark-target/inject.cmake" -DFORGE_BUILD_ID=unassigned -DFORGE_SOURCE_COMMIT=a98be9a672394d3d91c2b9067331d0252f9b4313
          if ($LASTEXITCODE) { throw 'Baseline configure failed' }
          cmake --build ../AgentFiles/b --target forge_editor_benchmark forge_runtime --parallel 2
          if ($LASTEXITCODE) { throw 'Baseline benchmark build failed' }
          $out='../AgentFiles/benchmark-baseline'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item ../AgentFiles/b/*.exe,../AgentFiles/b/*.dll $out
          Copy-Item resources "$out/resources" -Recurse -Force
          Copy-Item ../AgentFiles/benchmark-target/provenance.json $out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Editor-Benchmark-baseline
          path: ${{ runner.temp }}/forge-work/AgentFiles/benchmark-baseline

  editor-performance:
    needs: [editor, benchmark-baseline]
    if: ${{ always() && !cancelled() && !inputs.workflow_only && (needs.benchmark-baseline.result == 'success' || inputs.baseline_source_run != '') && (needs.editor.result == 'success' || inputs.performance_source_run != '') }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          if ($env:FORGE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'A full immutable source commit is required' }
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: FORGE-Editor-Benchmark-*
          path: ${{ runner.temp }}/forge-benchmark
      - name: Wait for referenced benchmark artifacts
        if: inputs.performance_source_run != '' || inputs.baseline_source_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_AUDIT_RUN: ${{ inputs.performance_source_run }}
          FORGE_BASELINE_RUN: ${{ inputs.baseline_source_run }}
        run: |
          foreach ($request in @(@{run=$env:FORGE_AUDIT_RUN;name='FORGE-Editor-Benchmark-current'}, @{run=$env:FORGE_BASELINE_RUN;name='FORGE-Editor-Benchmark-baseline'})) {
            if (!$request.run) { continue }
            if ($request.run -notmatch '^[0-9]+$') { throw 'Expected a numeric source-audit run ID' }
            $runId=$request.run
            $deadline=(Get-Date).AddMinutes(30)
            do {
              $data=gh api "repos/${{ github.repository }}/actions/runs/$runId/artifacts?per_page=100" | ConvertFrom-Json
              if ($LASTEXITCODE) { throw 'Cannot inspect referenced run artifacts' }
              if ($data.artifacts | Where-Object { $_.name -eq $request.name -and !$_.expired }) { break }
              $run=gh api "repos/${{ github.repository }}/actions/runs/$runId" | ConvertFrom-Json
              if ($LASTEXITCODE) { throw 'Cannot inspect referenced run status' }
              if ($run.status -eq 'completed') { throw "Referenced run completed without $($request.name)" }
              if ((Get-Date) -ge $deadline) { throw 'Timed out waiting for benchmark artifact' }
              Start-Sleep -Seconds 20
            } while ($true)
          }
      - name: Reuse the accepted baseline benchmark
        if: inputs.baseline_source_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: FORGE-Editor-Benchmark-baseline
          run-id: ${{ inputs.baseline_source_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-benchmark/FORGE-Editor-Benchmark-baseline
      - name: Reuse an unchanged current benchmark from the requested audit
        if: inputs.performance_source_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
