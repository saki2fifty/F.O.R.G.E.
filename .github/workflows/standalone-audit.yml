name: Standalone shared SDK audit
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      build_id:
        type: string
        default: unassigned
      clean_build:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      FORGE_BUILD_ID: ${{ inputs.build_id }}
      FORGE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: runner.os != 'Windows'
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ inputs.source_commit }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          if ($env:FORGE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'A full immutable source commit is required' }
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Check native developer launcher
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: cmd
        run: tools\Run-Forge-Dev.cmd --check
      - name: Prepare cache workspace path
        id: cache-workspace
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $preload = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE/tools/cache_workspace.cjs'
          "preload=$($preload.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Identify compatible Windows build cache
        id: cache-key
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_cache_key.py
      - name: Restore Windows dependencies and build outputs
        id: editor-cache
        continue-on-error: true
        if: ${{ !inputs.clean_build }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-shared-game-${{ inputs.source_commit }}
          restore-keys: |
            ${{ steps.cache-key.outputs.key }}-shared-game-
      - name: Discard an incomplete cache restore
        if: ${{ !inputs.clean_build && (steps.editor-cache.outcome == 'failure' || steps.editor-cache.outputs.cache-matched-key == '') }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          foreach ($directory in @('b', 'd')) {
            $cachePath = Join-Path $env:RUNNER_TEMP "forge-work/AgentFiles/$directory"
            if (Test-Path $cachePath) { Remove-Item -LiteralPath $cachePath -Recurse -Force }
          }
      - name: Restore timestamps of content-identical cached sources
        if: ${{ !inputs.clean_build }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_source_stamps.py restore ../AgentFiles/b/forge-source-stamps.json
      - name: Clear previous audit evidence from the build cache
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          foreach ($relative in @('grid-test-images', 'Testing/Temporary/LastTest.log', 'Testing/Temporary/LastTestsFailed.log')) {
            $output = Join-Path '../AgentFiles/b' $relative
            if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          }
      - name: Configure shared SDK graphical standalone
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: cmake --preset windows-editor -B ../AgentFiles/b -DFORGE_BUILD_EDITOR=OFF -DFORGE_BUILD_GAME=ON -DFORGE_BUILD_ASSET_TOOLS=ON -DFORGE_ENABLE_NATIVE_SDK=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DFETCHCONTENT_BASE_DIR:PATH="${{ runner.temp }}/forge-work/AgentFiles/d" -DCMAKE_BUILD_TYPE=Release -DFORGE_BUILD_ID="${{ inputs.build_id }}" -DFORGE_SOURCE_COMMIT="${{ inputs.source_commit }}" -DCMAKE_PROJECT_INCLUDE:FILEPATH=
      - name: Build exact standalone and export tools
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: cmake --build ../AgentFiles/b --target forge_sample forge_game forge_game_fixture forge_tools forge_runtime forge_ui_inspect forge_standalone_manifest_tests forge_runtime_ui_package_tests forge_sdk_tests forge_navigation_tests forge_nav_build forge_animation_tests forge_asset_build_worker gltf2ozz --parallel 2
      - name: Install runtime and matching SDK; build a consumer deployment
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          $b=(Resolve-Path ../AgentFiles/b).Path
          foreach($dir in @('runtime-kit','installed-sdk','module-kits','module-build','standalone-delivery')) {
            $path=Join-Path $b $dir
            if(Test-Path $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }
          cmake --install $b --component GameRuntime --prefix "$b/runtime-kit"
          if($LASTEXITCODE) { throw 'Runtime kit install failed' }
          cmake --install $b --component NativeSdk --prefix "$b/installed-sdk"
          if($LASTEXITCODE) { throw 'SDK install failed' }
          cmake -S "$b/installed-sdk/sdk/sample" -B "$b/module-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl -DFORGE_NATIVE_SDK="$b/installed-sdk"
          if($LASTEXITCODE) { throw 'Installed consumer configure failed' }
          cmake --build "$b/module-build" --parallel 2
          if($LASTEXITCODE) { throw 'Installed consumer build failed' }
          cmake --install "$b/module-build" --component GameplayRuntime --prefix "$b/module-kits"
          if($LASTEXITCODE) { throw 'Module kit install failed' }
          ctest --test-dir $b -R '^(standalone_manifest|standalone_module_export|runtime_ui_package|native_sdk|native_sdk_package|standalone_game_workflow)$' --output-on-failure
          if($LASTEXITCODE) { throw 'Shared standalone regressions failed' }
          python tests/standalone_package_test.py --build $b --kit "$b/runtime-kit" --module-kit "$b/module-kits/project.example" --evidence "$b/grid-test-images/shared-game" --source . --retain "$b/standalone-delivery/game"
          if($LASTEXITCODE) { throw 'Shared standalone export failed' }
          Copy-Item tests/standalone_relocated_probe.py "$b/standalone-delivery/probe.py"
      - name: Upload matching graphical-host SDK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Game-SDK-Windows
          path: ${{ runner.temp }}/forge-work/AgentFiles/b/experimental-native-sdk.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact shared graphical runtime kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Shared-Game-Runtime-Kit
          path: ${{ runner.temp }}/forge-work/AgentFiles/b/runtime-kit
          if-no-files-found: error
          retention-days: 14
      - name: Upload clean-room acceptance input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Standalone-Acceptance-Input
          path: ${{ runner.temp }}/forge-work/AgentFiles/b/standalone-delivery
          retention-days: 7
      - name: Upload build and capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Standalone-Shared-Build
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b/grid-test-images
            ${{ runner.temp }}/forge-work/AgentFiles/b/Testing/Temporary/LastTest.log
          retention-days: 14
      - name: Record source timestamps for incremental reuse
        if: always()
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_source_stamps.py record ../AgentFiles/b/forge-source-stamps.json
      - name: Save reusable shared build cache
        if: ${{ always() && !inputs.clean_build && steps.editor-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-shared-game-${{ inputs.source_commit }}
  relocated:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: FORGE-Standalone-Acceptance-Input
          path: ${{ runner.temp }}/Relocated FORGE Game
      - name: Run without source checkout, original build or SDK
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: python "Relocated FORGE Game/probe.py" "Relocated FORGE Game/game" "standalone-clean-room-evidence"
      - name: Upload clean-room evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Standalone-Relocated
          path: ${{ runner.temp }}/standalone-clean-room-evidence
          retention-days: 14
