name: HLSL sampler profile
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          if ($env:FORGE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'A full immutable source commit is required' }
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - name: Compile and exercise the SDK compiler
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'forge-sampler-profile'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          cl /nologo /EHsc /std:c++20 tests/hlsl_sampler_profile.cpp "/Fo$output/probe.obj" "/Fe$output/probe.exe" /link d3dcompiler.lib
          if ($LASTEXITCODE) { throw 'Sampler profile probe did not compile' }
          (Get-Item "$env:WINDIR/System32/d3dcompiler_47.dll").VersionInfo | Format-List | Out-File "$output/compiler-version.txt"
          Push-Location $output
          try {
            & ./probe.exe | Tee-Object results.txt
            if ($LASTEXITCODE) { throw 'Register-free bounded sampler array plus environment/comparison samplers failed SM5.1 compilation' }
          } finally { Pop-Location }
      - name: Validate zero and dynamic surface normalization with FXC
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'forge-sampler-profile'
          $shader = (Resolve-Path tests/surface_normalization.hlsl).Path
          cl /nologo /EHsc /std:c++20 tests/hlsl_surface_profile.cpp "/Fo$output/surface.obj" "/Fe$output/surface.exe" /link d3dcompiler.lib
          if ($LASTEXITCODE) { throw 'Surface compiler probe did not compile' }
          Push-Location $output
          try {
            & ./surface.exe $shader | Tee-Object surface-results.txt
            if ($LASTEXITCODE) { throw 'FXC surface normalization warnings/errors' }
          } finally { Pop-Location }
      - name: Validate patched pinned lighting shaders independently
        if: always()
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'forge-sampler-profile'
          $engine = Join-Path $env:RUNNER_TEMP 'forge-shader-dependency'
          $pin = [regex]::Match((Get-Content cmake/diligent_source.cmake -Raw), 'GIT_TAG ([0-9a-f]{40})').Groups[1].Value
          if (!$pin) { throw 'Missing immutable Diligent pin' }
          git init $engine
          git -C $engine remote add origin https://github.com/DiligentGraphics/DiligentEngine.git
          git -C $engine fetch --depth=1 origin $pin
          if ($LASTEXITCODE) { throw 'Pinned engine fetch failed' }
          git -C $engine checkout --detach FETCH_HEAD
          git -C $engine submodule update --init --depth=1 DiligentFX DiligentCore
          if ($LASTEXITCODE) { throw 'Pinned FX fetch failed' }
          git -C $engine submodule status DiligentFX DiligentCore | Out-File "$output/dependency.txt"
          $shaders = Join-Path $output 'lighting'
          New-Item -ItemType Directory -Path $shaders -Force | Out-Null
          Get-ChildItem "$engine/DiligentFX/Shaders" -Recurse -Filter '*.fxh' | ForEach-Object {
            $target = Join-Path $shaders $_.Name
            if (Test-Path $target) { throw "Ambiguous shader include: $target" }
            Copy-Item $_.FullName $target
          }
          python tools/stage_diligentfx_patch.py $engine "$output/patched-fx"
          if ($LASTEXITCODE) { throw 'Reviewed shader patch failed' }
          python tests/diligentfx_patch_test.py $engine
          if ($LASTEXITCODE) { throw 'Patch reproducibility tests failed' }
          Get-ChildItem "$output/patched-fx" -Recurse -Filter '*.fxh' | ForEach-Object { Copy-Item $_.FullName (Join-Path $shaders $_.Name) -Force }
          Copy-Item "$engine/DiligentCore/Graphics/ShaderTools/include/HLSLDefinitions.fxh" $shaders
          Copy-Item resources/shaders/*.fxh $shaders
          Copy-Item tests/lighting_diagnostics.hlsl $shaders
          Push-Location $output
          try {
            & ./surface.exe "$shaders/lighting_diagnostics.hlsl" upstream_iridescence upstream_sheen forge_lighting forge_shadow | Tee-Object lighting-results.txt
            if ($LASTEXITCODE) { throw 'Lighting shader diagnostics failed; inspect individual logs' }
          } finally { Pop-Location }
      - name: Preserve compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hlsl-sampler-profile-${{ github.sha }}
          path: ${{ runner.temp }}/forge-sampler-profile
          retention-days: 14
