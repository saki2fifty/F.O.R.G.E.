name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hlsl_profile:
        description: Run only the focused Windows sampler compiler probe (no engine build or package)
        type: boolean
        default: false
      package_source_run:
        description: Optional prior run with successful core/editor/format jobs; assemble its unchanged binaries only
        type: string
        default: ""
      audit_source:
        description: Optional immutable source SHA for editor-only audit (no package)
        type: string
        default: ""
      audit_baseline_source_run:
        description: Reuse this audit run's immutable accepted-baseline benchmark artifact
        type: string
        default: ""
      audit_performance_source_run:
        description: Reuse this source-audit run's unchanged current benchmark; build baseline and compare only
        type: string
        default: ""
      audit_workflow_only:
        description: For audit_source only, build/run the editor input workflow instead of the full audit
        type: boolean
        default: false
      standalone_audit:
        description: For audit_source, validate the shared SDK standalone host and clean-room relocation
        type: boolean
        default: false
      windows_package:
        description: Build and upload the Windows editor ZIP
        type: boolean
        default: true
      core_windows_only:
        description: For a core-only dispatch, validate both Windows profiles while retaining separately attributed Linux evidence
        type: boolean
        default: false
      build_id:
        description: Reserved UTC yymmdd-counter identifier (required for a Windows package)
        type: string
        default: ""
      clean_build:
        description: Ignore the build cache for a clean verification
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ inputs.standalone_audit && '-standalone' || '' }}${{ inputs.audit_performance_source_run != '' && format('-benchmark-{0}', inputs.audit_performance_source_run) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
  actions: read
jobs:
  hlsl-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.hlsl_profile
    uses: ./.github/workflows/hlsl-profile.yml
  source-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_source != '' && !inputs.hlsl_profile && !inputs.standalone_audit
    uses: ./.github/workflows/editor-audit.yml
    with:
      source_commit: ${{ inputs.audit_source }}
      workflow_only: ${{ inputs.audit_workflow_only }}
      performance_source_run: ${{ inputs.audit_performance_source_run }}
      baseline_source_run: ${{ inputs.audit_baseline_source_run }}
      clean_build: ${{ inputs.clean_build }}
  standalone-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_source != '' && inputs.standalone_audit
    uses: ./.github/workflows/standalone-audit.yml
    with:
      source_commit: ${{ inputs.audit_source }}
      clean_build: ${{ inputs.clean_build }}
  shared-game:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_package && inputs.audit_source == '' && inputs.package_source_run == '' && !inputs.hlsl_profile
    uses: ./.github/workflows/standalone-audit.yml
    with:
      source_commit: ${{ github.sha }}
      build_id: ${{ inputs.build_id }}
      clean_build: ${{ inputs.clean_build }}
  core:
    if: inputs.audit_source == '' && inputs.package_source_run == '' && !inputs.hlsl_profile
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && !inputs.windows_package && inputs.core_windows_only && '["windows-2022"]' || '["ubuntu-22.04","windows-2022"]') }}
        profile: [core, native-sdk]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CC: ${{ matrix.os == 'ubuntu-22.04' && 'gcc-12' || 'cl' }}
      CXX: ${{ matrix.os == 'ubuntu-22.04' && 'g++-12' || 'cl' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: runner.os != 'Windows'
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        if: runner.os == 'Windows'
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - name: Install Jolt compiler baseline
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-12
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Validate manual and build identity
        run: python tests/manual_test.py
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Verify package assembly integrity
        run: python tests/package_assembly_test.py
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Test build-cache invalidation
        run: python tests/ci_cache_test.py
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: cmake --preset ${{ matrix.profile }} -DFORGE_BUILD_ID=${{ inputs.build_id || 'unassigned' }} -DFORGE_SOURCE_COMMIT=${{ github.sha }}
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: cmake --build --preset ${{ matrix.profile }} --parallel 2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: ctest --preset ${{ matrix.profile }}
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: cmake --install ../AgentFiles/build/core --prefix ../AgentFiles/install/core --component Runtime
        if: matrix.profile == 'core'
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Resolve experimental SDK artifact path
        if: matrix.profile == 'native-sdk' && github.event_name == 'workflow_dispatch'
        id: sdk-artifact
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
        run: python -c "import os; from pathlib import Path; p=Path('../AgentFiles/build/native-sdk/experimental-native-sdk.tar.gz').resolve(); assert p.is_file(); open(os.environ['GITHUB_OUTPUT'],'a').write('path='+p.as_posix()+'\n')"
      - name: Save experimental exact native SDK
        if: matrix.profile == 'native-sdk' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Experimental-SDK-${{ matrix.os }}
          path: ${{ steps.sdk-artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14
  editor:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_package && inputs.audit_source == '' && inputs.package_source_run == '' && !inputs.hlsl_profile
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      FORGE_BUILD_ID: ${{ inputs.build_id }}
      FORGE_SOURCE_COMMIT: ${{ github.sha }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: runner.os != 'Windows'
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Validate reserved build identity and manual
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: |
          python -c "import os,sys; sys.path.insert(0,'tools'); from build_identity import validate_build_id; print(validate_build_id(os.environ['FORGE_BUILD_ID']))"
          python tests/manual_test.py
      - name: Check native developer launcher
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: cmd
        run: tools\Run-Forge-Dev.cmd --check
      - name: Prepare cache workspace path
        id: cache-workspace
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $preload = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE/tools/cache_workspace.cjs'
          "preload=$($preload.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Identify compatible Windows build cache
        id: cache-key
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_cache_key.py
      - name: Restore Windows dependencies and build outputs
        id: editor-cache
        continue-on-error: true
        if: ${{ !inputs.clean_build }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.key }}-
      - name: Discard an incomplete cache restore
        if: ${{ !inputs.clean_build && (steps.editor-cache.outcome == 'failure' || steps.editor-cache.outputs.cache-matched-key == '') }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          foreach ($directory in @('b', 'd')) {
            $cachePath = Join-Path $env:RUNNER_TEMP "forge-work/AgentFiles/$directory"
            if (Test-Path $cachePath) { Remove-Item -LiteralPath $cachePath -Recurse -Force }
          }
      - name: Restore timestamps of content-identical cached sources
        if: ${{ !inputs.clean_build }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_source_stamps.py restore ../AgentFiles/b/forge-source-stamps.json
      - id: editor-configure
        run: cmake --preset windows-editor -B ../AgentFiles/b -DFORGE_ENABLE_NATIVE_SDK=OFF -DFORGE_BUILD_ASSET_TOOLS=ON -DFORGE_BUILD_GAME=ON -DFETCHCONTENT_BASE_DIR:PATH="${{ runner.temp }}/forge-work/AgentFiles/d" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DFORGE_BUILD_ID="$env:FORGE_BUILD_ID" -DFORGE_SOURCE_COMMIT="$env:FORGE_SOURCE_COMMIT"
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Build process controllers before renderer
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: cmake --build ../AgentFiles/b --target forge_runtime forge_editor_tests forge_editor_native_tests forge_fault_runtime --parallel 2
      - name: Install exact standalone runtime kit
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          $kit = Join-Path (Resolve-Path ../AgentFiles/b) 'runtime-kit'
          if (Test-Path $kit) { Remove-Item -LiteralPath $kit -Recurse -Force }
          cmake --install ../AgentFiles/b --component GameRuntime --prefix $kit
          if ($LASTEXITCODE) { throw 'Runtime kit installation failed' }
      - name: Verify process controllers before renderer
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: ctest --test-dir ../AgentFiles/b -R "editor_process_and_scale|editor_native_iteration" --output-on-failure
      - run: cmake --build ../AgentFiles/b --target forge_game forge_game_fixture forge_game_content_tests forge_game_foundation_tests forge_game_platform_tests forge_draw_fallback_tests forge_cache_maintenance_tests forge_asset_scale_tests forge_runtime_package_tests forge_standalone_manifest_tests forge_authored_schema_tests forge_authored_component_tests forge_authored_migration_tests forge_authored_components_editor_tests forge_render_bounds_tests forge_shader_tests forge_shader_pipeline_tests forge_shader_worker_tests forge_shader_editor_tests forge_mesh_asset_tests forge_material_asset_tests forge_material_pipeline_tests forge_material_editor_tests forge_content_files_tests forge_source_copy_tests forge_asset_file_transaction_tests forge_asset_file_operations_tests forge_texture_asset_tests forge_texture_import_tests forge_texture_ktx_tests forge_texture_dds_tests forge_texture_bmp_tests forge_texture_webp_tests forge_texture_pipeline_tests forge_texture_bundle_tests forge_texture_editor_tests forge_model_editor_tests forge_asset_import_service_tests forge_asset_build_worker forge_resource_tests forge_asset_publication_tests forge_asset_robustness_tests forge_gltf_official_corpus_tests forge_gltf_official_tests forge_asset_worker_tests forge_asset_worker_fixture forge_asset_importer_tests forge_import_settings_tests forge_gltf_animation_tests forge_gltf_hierarchy_tests forge_gltf_mesh_tests forge_mesh_processing_tests forge_gltf_meshopt_tests forge_gltf_draco_tests forge_gltf_surfaces_tests forge_gltf_snapshot_tests forge_model_bundle_tests forge_model_pipeline_tests forge_model_scene_tests forge_gltf_ozz_tests forge_morph_animation_tests forge_gltf_native_tests forge_gltf_accessor_tests forge_gltf_source_tests forge_subasset_identity_tests forge_asset_subasset_tests forge_asset_discovery_tests forge_asset_build_tests forge_asset_job_tests forge_runtime_ui_tests forge_ui_presenter_tests forge_runtime_ui_package_tests forge_ui_catalog_presenter_tests forge_ui_asset_catalog_tests forge_ui_render_tests forge_ui_input_tests forge_editor_fixture forge_editor forge_runtime forge_nav_build forge_navigation_tests forge_navigation_mesh_tests gltf2ozz forge_animation_worker_tests forge_animation_worker_fixture forge_animation_tests forge_animation_archive_tests forge_audio_asset_tests forge_audio_tests forge_physics_tests forge_module_tests forge_services_tests forge_runtime_clock_tests forge_sample forge_tools forge_prefab_tests forge_transform_tests forge_identity_tests forge_world_tests forge_authoring_tests forge_live_tests forge_editor_tests forge_fault_runtime forge_editor_native_tests forge_viewport_tests --parallel 2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Compile preview shaders
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tests/preview_shader_test.py
      - name: Test editor process isolation and scaling
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: ctest --test-dir ../AgentFiles/b -R "draw_fallbacks|cache_maintenance|asset_scale_workloads|game_content|game_foundation|game_storage_process|game_platform|runtime_content_package|standalone_manifest|authored_schema|authored_component|authored_migration|authored_components_editor|shader_assets|shader_pipeline|shader_worker|shader_editor|mesh_asset|material_asset|material_pipeline|material_editor|content_files|source_copy|asset_file_transaction|asset_file_operations|texture_asset|texture_import|texture_ktx|texture_dds|texture_bmp|texture_webp|texture_recipe|texture_pipeline|texture_bundle|texture_tools|texture_editor|model_editor|asset_import_service|resource_lifetime|asset_publication|asset_robustness_corpus|gltf_official_corpus|gltf_official_negative_scale|asset_worker_policy|asset_importer_registry|import_settings|gltf_animation_admission|gltf_hierarchy|gltf_mesh_processing|mesh_processing|gltf_meshopt|gltf_draco|gltf_surfaces|gltf_snapshot|model_bundle|model_scene|gltf_ozz|morph_animation|model_recipe|model_pipeline|model_tools|gltf_native_capture|gltf_accessors|gltf_source|subasset_identity|asset_subassets|asset_catalog_scale|asset_discovery|asset_tools|asset_jobs|asset_build|flecs_script|ecs_tools|target_boundaries|phase6_integration|runtime_ui|ui_presenter|runtime_ui_package|ui_catalog_presenter|ui_asset_catalog|ui_process|editor_viewport_render|editor_render_morph|editor_render_skin|editor_render_frame|editor_render_optics|editor_redesign_render|editor_input_workflow|navigation|animation|audio|physics|module_lifecycle|core_services|input_protocol|authoring_|world_lifetime|structured_prefabs|persistent_identity|hierarchical_transforms|runtime_clock_and_interpolation|runtime_protocol" --output-on-failure
      - name: Save viewport render checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Viewport-Checks
          path: ${{ runner.temp }}/forge-work/AgentFiles/b/grid-test-images/**/*.ppm
          if-no-files-found: warn
      - name: Upload runtime UI render checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Runtime-UI-Checks
          path: ${{ runner.temp }}/forge-work/AgentFiles/b/ui-test-images/*.ppm
          if-no-files-found: warn
      - name: Verify compiled build identifiers
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          foreach ($binary in @('forge_editor.exe', 'forge_runtime.exe', 'forge_tools.exe')) {
            $reported = & "../AgentFiles/b/$binary" --version
            if ($LASTEXITCODE -ne 0 -or -not $reported.EndsWith("Build: $env:FORGE_BUILD_ID")) { throw "Build identifier mismatch: $binary" }
            Write-Output $reported
          }
      - name: Package Windows editor
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/package_windows.py --build ../AgentFiles/b --dependencies ../AgentFiles/d --output "../AgentFiles/packages/${env:FORGE_BUILD_ID}-FORGE-Windows-x64.zip"
      - name: Verify packaged runtime UI after relocation
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: python tests/ui_package_test.py "../AgentFiles/packages/${env:FORGE_BUILD_ID}-FORGE-Windows-x64.zip" ../AgentFiles/b/forge_ui_render_tests.exe
      - name: Verify packaged navigation worker after relocation
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: python tests/navigation_package_test.py "../AgentFiles/packages/${env:FORGE_BUILD_ID}-FORGE-Windows-x64.zip" ../AgentFiles/b/forge_navigation_tests.exe
      - name: Verify packaged animation converter after relocation
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tests/animation_package_test.py "../AgentFiles/packages/${env:FORGE_BUILD_ID}-FORGE-Windows-x64.zip" ../AgentFiles/b/forge_animation_tests.exe
      - name: Record source content and input timestamps for incremental reuse
        if: ${{ always() && !inputs.clean_build && steps.editor-configure.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_source_stamps.py record ../AgentFiles/b/forge-source-stamps.json
      - name: Save verified Windows build cache
        continue-on-error: true
        if: ${{ !inputs.clean_build && steps.editor-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-${{ github.sha }}
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Windows-Editor-Base
          path: ${{ runner.temp }}/forge-work/AgentFiles/packages/*-FORGE-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
  package:
    needs: [core, editor, format, shared-game]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.windows_package && inputs.audit_source == '' && (inputs.package_source_run != '' || (needs.core.result == 'success' && needs.editor.result == 'success' && needs.format.result == 'success' && needs.shared-game.result == 'success')) && !inputs.hlsl_profile
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify reusable compiled-source provenance
        id: compiled
        shell: pwsh
        env:
          FORGE_REUSE_RUN: ${{ inputs.package_source_run }}
          FORGE_API_TOKEN: ${{ github.token }}
        run: |
          $run = if ($env:FORGE_REUSE_RUN) { $env:FORGE_REUSE_RUN } else { '${{ github.run_id }}' }
          if ($run -notmatch '^\d+$') { throw 'Invalid source run identifier' }
          $headers = @{ Authorization = "Bearer $env:FORGE_API_TOKEN"; Accept = 'application/vnd.github+json' }
          $base = '${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/' + $run
          $source = Invoke-RestMethod -Uri $base -Headers $headers
          $jobs = (Invoke-RestMethod -Uri "$base/jobs?per_page=100" -Headers $headers).jobs
          foreach ($name in @('core (ubuntu-22.04, core)', 'core (ubuntu-22.04, native-sdk)', 'core (windows-2022, core)', 'core (windows-2022, native-sdk)', 'editor', 'format', 'shared-game / build', 'shared-game / relocated')) {
            $job = @($jobs | Where-Object { $_.name -eq $name })
            if ($job.Count -ne 1 -or $job[0].conclusion -ne 'success') { throw "Source validation missing: $name" }
          }
          "sha=$($source.head_sha)" >> $env:GITHUB_OUTPUT
          "run=$run" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FORGE-Windows-Editor-Base
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/editor
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FORGE-Game-SDK-Windows
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/sdk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: FORGE-Shared-Game-Runtime-Kit
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/shared-game
      - name: Assemble and verify matching editor and exact SDK
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        env:
          FORGE_PACKAGE_ID: ${{ inputs.build_id }}
          FORGE_COMPILED_SOURCE: ${{ steps.compiled.outputs.sha }}
        run: |
          $name = "$env:FORGE_PACKAGE_ID-FORGE-Windows-x64.zip"
          $root = Join-Path $env:RUNNER_TEMP 'forge-package'
          python tools/assemble_windows_package.py --editor "$root/editor/$name" --sdk "$root/sdk/experimental-native-sdk.tar.gz" --output "$root/final/$name" --runtime-kit "$root/shared-game"
          if ($LASTEXITCODE) { throw 'Combined package assembly failed' }
          python tests/windows_combined_package_test.py "$root/final/$name"
          if ($LASTEXITCODE) { throw 'Combined package relocation failed' }
      - name: Upload complete Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Windows-x64
          path: ${{ runner.temp }}/forge-package/final/*-FORGE-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
  format:
    if: inputs.audit_source == '' && inputs.package_source_run == '' && !inputs.hlsl_profile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install clang-format==23.1.1
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: python tools/check_format.py
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
