name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        if: runner.os == 'Windows'
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
      - run: cmake --preset core
      - run: cmake --build --preset core --parallel 2
      - run: ctest --preset core
      - run: cmake --install ../AgentFiles/build/core --prefix ../AgentFiles/install/core --component Runtime
  editor:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
      - run: cmake --preset windows-editor -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - run: cmake --build --preset windows-editor --target forge_editor forge_runtime --parallel 2
      - name: Package Windows editor
        run: python tools/package_windows.py --build ../AgentFiles/build/windows-editor --dependencies ../AgentFiles/dependencies/windows-editor --output ../AgentFiles/packages/FORGE-Windows-x64.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Windows-x64
          path: ../AgentFiles/packages/FORGE-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install clang-format==23.1.1
      - run: python tools/check_format.py
