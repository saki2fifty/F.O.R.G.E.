name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hlsl_profile:
        description: Run only the focused Windows sampler compiler probe (no engine build or package)
        type: boolean
        default: false
      package_source_run:
        description: Optional prior run with successful core/editor/format jobs; assemble its unchanged binaries only
        type: string
        default: ""
      audit_source:
        description: Optional immutable source SHA for editor-only audit (no package)
        type: string
        default: ""
      audit_baseline_source_run:
        description: Reuse this audit run's immutable accepted-baseline benchmark artifact
        type: string
        default: ""
      audit_performance_source_run:
        description: Reuse this source-audit run's unchanged current benchmark; build baseline and compare only
        type: string
        default: ""
      audit_shader_only:
        description: For audit_source, run shader/material tests and native GPU captures only
        type: boolean
        default: false
      audit_workflow_only:
        description: For audit_source only, build/run the editor input workflow instead of the full audit
        type: boolean
        default: false
      audit_capture_only:
        description: For audit_source, run only Sprite sheet and audio-preview capture diagnostics (partial audit)
        type: boolean
        default: false
      standalone_audit:
        description: For audit_source, validate the shared SDK standalone host and clean-room relocation
        type: boolean
        default: false
      windows_package:
        description: Build and upload the Windows editor ZIP
        type: boolean
        default: true
      core_windows_only:
        description: For a core-only dispatch, validate both Windows profiles while retaining separately attributed Linux evidence
        type: boolean
        default: false
      tile_source_only:
        description: Diagnose the complete Tile Map source workload in Windows Debug; no package or full-matrix claim
        type: boolean
        default: false
      build_id:
        description: Reserved UTC yymmdd-counter identifier (required for a Windows package)
        type: string
        default: ""
      clean_build:
        description: Ignore the build cache for a clean verification
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ inputs.standalone_audit && '-standalone' || '' }}${{ inputs.audit_performance_source_run != '' && format('-benchmark-{0}', inputs.audit_performance_source_run) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
  actions: read
jobs:
  tile-source:
    if: github.event_name == 'workflow_dispatch' && inputs.tile_source_only
    uses: ./.github/workflows/tile-source-audit.yml
    with:
      source_commit: ${{ github.sha }}
  hlsl-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.hlsl_profile
    uses: ./.github/workflows/hlsl-profile.yml
  source-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_source != '' && !inputs.hlsl_profile && !inputs.standalone_audit
    uses: ./.github/workflows/editor-audit.yml
    with:
      source_commit: ${{ inputs.audit_source }}
      workflow_only: ${{ inputs.audit_workflow_only || inputs.audit_capture_only }}
      capture_only: ${{ inputs.audit_capture_only }}
      shader_only: ${{ inputs.audit_shader_only }}
      performance_source_run: ${{ inputs.audit_performance_source_run }}
      baseline_source_run: ${{ inputs.audit_baseline_source_run }}
      clean_build: ${{ inputs.clean_build }}
  standalone-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_source != '' && inputs.standalone_audit
    uses: ./.github/workflows/standalone-audit.yml
    with:
      source_commit: ${{ inputs.audit_source }}
      clean_build: ${{ inputs.clean_build }}
  shared-game:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_package && inputs.audit_source == '' && inputs.package_source_run == '' && !inputs.hlsl_profile
    uses: ./.github/workflows/standalone-audit.yml
    with:
      source_commit: ${{ github.sha }}
      build_id: ${{ inputs.build_id }}
      clean_build: ${{ inputs.clean_build }}
  core:
    if: inputs.audit_source == '' && inputs.package_source_run == '' && !inputs.hlsl_profile && !inputs.tile_source_only
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && !inputs.windows_package && inputs.core_windows_only && '["windows-2022"]' || '["ubuntu-22.04","windows-2022"]') }}
        profile: [core, native-sdk]
    runs-on: ${{ matrix.os }}
    # Clean core and SDK builds need room for the complete suite after compilation.
    # Cold Windows core build/test/install measured45 minutes before cleanup.
    # Keep the full selection and test deadlines with bounded job headroom.
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CC: ${{ matrix.os == 'ubuntu-22.04' && 'gcc-12' || 'cl' }}
      CXX: ${{ matrix.os == 'ubuntu-22.04' && 'g++-12' || 'cl' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: runner.os != 'Windows'
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        if: runner.os == 'Windows'
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - name: Install Jolt compiler baseline
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-12
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Validate manual and build identity
        run: python tests/manual_test.py
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Verify package assembly integrity
        run: python tests/package_assembly_test.py
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Test build-cache invalidation
        run: python tests/ci_cache_test.py
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: cmake --preset ${{ matrix.profile }} -DFORGE_BUILD_ID=${{ inputs.build_id || 'unassigned' }} -DFORGE_SOURCE_COMMIT=${{ github.sha }}
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: cmake --build --preset ${{ matrix.profile }} --parallel 2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: ctest --preset ${{ matrix.profile }}
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: cmake --install ../AgentFiles/build/core --prefix ../AgentFiles/install/core --component Runtime
        if: matrix.profile == 'core'
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Resolve experimental SDK artifact path
        if: matrix.profile == 'native-sdk' && github.event_name == 'workflow_dispatch'
        id: sdk-artifact
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
        run: python -c "import os; from pathlib import Path; p=Path('../AgentFiles/build/native-sdk/experimental-native-sdk.tar.gz').resolve(); assert p.is_file(); open(os.environ['GITHUB_OUTPUT'],'a').write('path='+p.as_posix()+'\n')"
      - name: Save experimental exact native SDK
        if: matrix.profile == 'native-sdk' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Experimental-SDK-${{ matrix.os }}
          path: ${{ steps.sdk-artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14
  editor:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_package && inputs.audit_source == '' && inputs.package_source_run == '' && !inputs.hlsl_profile
    runs-on: windows-2022
    # Match the source gate's measured cold-build/acceptance budget.
    timeout-minutes: 150
    env:
      FORGE_BUILD_ID: ${{ inputs.build_id }}
      FORGE_SOURCE_COMMIT: ${{ github.sha }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: runner.os != 'Windows'
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Validate reserved build identity and manual
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: |
          python -c "import os,sys; sys.path.insert(0,'tools'); from build_identity import validate_build_id; print(validate_build_id(os.environ['FORGE_BUILD_ID']))"
          python tests/manual_test.py
      - name: Check native developer launcher
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: cmd
        run: tools\Run-Forge-Dev.cmd --check
      - name: Prepare cache workspace path
        id: cache-workspace
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $preload = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE/tools/cache_workspace.cjs'
          "preload=$($preload.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Identify compatible Windows build cache
        id: cache-key
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_cache_key.py
      - name: Restore Windows dependencies and build outputs
        id: editor-cache
        continue-on-error: true
        if: ${{ !inputs.clean_build }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.key }}-
      - name: Discard an incomplete cache restore
        if: ${{ !inputs.clean_build && (steps.editor-cache.outcome == 'failure' || steps.editor-cache.outputs.cache-matched-key == '') }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          foreach ($directory in @('b', 'd')) {
            $cachePath = Join-Path $env:RUNNER_TEMP "forge-work/AgentFiles/$directory"
            if (Test-Path $cachePath) { Remove-Item -LiteralPath $cachePath -Recurse -Force }
          }
      - name: Restore timestamps of content-identical cached sources
        if: ${{ !inputs.clean_build }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_source_stamps.py restore ../AgentFiles/b/forge-source-stamps.json
      - id: editor-configure
        run: cmake --preset windows-editor -B ../AgentFiles/b -DFORGE_ENABLE_NATIVE_SDK=OFF -DFORGE_BUILD_ASSET_TOOLS=ON -DFORGE_BUILD_GAME=ON -DFETCHCONTENT_BASE_DIR:PATH="${{ runner.temp }}/forge-work/AgentFiles/d" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DFORGE_BUILD_ID="$env:FORGE_BUILD_ID" -DFORGE_SOURCE_COMMIT="$env:FORGE_SOURCE_COMMIT"
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Build process controllers before renderer
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: cmake --build ../AgentFiles/b --target forge_runtime forge_editor_tests forge_fault_runtime --parallel 2
      - name: Verify process controllers before renderer
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: ctest --test-dir ../AgentFiles/b -R "editor_process_and_scale" --output-on-failure
      - id: editor-build
        run: cmake --build ../AgentFiles/b --parallel 2
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - name: Install exact standalone runtime kit
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          $kit = Join-Path (Resolve-Path ../AgentFiles/b) 'runtime-kit'
          if (Test-Path $kit) { Remove-Item -LiteralPath $kit -Recurse -Force }
          cmake --install ../AgentFiles/b --component GameRuntime --prefix $kit
          if ($LASTEXITCODE) { throw 'Runtime kit installation failed' }
      - name: Compile preview shaders
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tests/preview_shader_test.py
      - name: Run full editor acceptance
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          $selection = (Get-Content tools/editor_acceptance_regex.txt -Raw).Trim()
          ctest --test-dir ../AgentFiles/b -R $selection --output-on-failure
          if ($LASTEXITCODE) { throw 'Full editor acceptance failed' }
      - name: Save viewport render checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Viewport-Checks
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b/grid-test-images
            ${{ runner.temp }}/forge-work/AgentFiles/b/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/forge-work/AgentFiles/b/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
      - name: Upload runtime UI render checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Runtime-UI-Checks
          path: ${{ runner.temp }}/forge-work/AgentFiles/b/ui-test-images/*.ppm
          if-no-files-found: warn
      - name: Verify compiled build identifiers
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          foreach ($binary in @('forge_editor.exe', 'forge_runtime.exe', 'forge_tools.exe')) {
            $reported = & "../AgentFiles/b/$binary" --version
            if ($LASTEXITCODE -ne 0 -or -not $reported.EndsWith("Build: $env:FORGE_BUILD_ID")) { throw "Build identifier mismatch: $binary" }
            Write-Output $reported
          }
      - name: Upload editor SDK fixture executable
        # Ship only the editor fixture EXE. The shipped FORGE-Windows-x64
        # ZIP already supplies the matching editor DLLs/resources the
        # fixture was linked against; the acceptance helper copies the
        # fixture EXE beside the extracted forge_editor.exe and runs it
        # there with the extracted NativeSdk, so any missing packaged
        # dependency fails the verification rather than being masked by
        # a separate DLL bundle.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Editor-SDK-Fixture
          path: ${{ runner.temp }}/forge-work/AgentFiles/b/forge_editor_fixture.exe
          if-no-files-found: error
          retention-days: 7
      - name: Verify complete Gallery packaging
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tests/windows_example_packaging_test.py
      - name: Package Windows editor
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/package_windows.py --build ../AgentFiles/b --dependencies ../AgentFiles/d --output "../AgentFiles/packages/${env:FORGE_BUILD_ID}-FORGE-Windows-x64.zip"
      - name: Verify packaged runtime UI after relocation
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: python tests/ui_package_test.py "../AgentFiles/packages/${env:FORGE_BUILD_ID}-FORGE-Windows-x64.zip" ../AgentFiles/b/forge_ui_render_tests.exe
      - name: Verify packaged navigation worker after relocation
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: python tests/navigation_package_test.py "../AgentFiles/packages/${env:FORGE_BUILD_ID}-FORGE-Windows-x64.zip" ../AgentFiles/b/forge_navigation_tests.exe
      - name: Verify packaged animation converter after relocation
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tests/animation_package_test.py "../AgentFiles/packages/${env:FORGE_BUILD_ID}-FORGE-Windows-x64.zip" ../AgentFiles/b/forge_animation_tests.exe
      - name: Record source content and input timestamps for incremental reuse
        if: ${{ always() && !inputs.clean_build && steps.editor-configure.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: python tools/ci_source_stamps.py record ../AgentFiles/b/forge-source-stamps.json
      - name: Save reusable Windows compilation cache
        continue-on-error: true
        if: ${{ always() && !cancelled() && !inputs.clean_build && steps.editor-build.outcome == 'success' && steps.editor-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: |
            ${{ runner.temp }}/forge-work/AgentFiles/b
            ${{ runner.temp }}/forge-work/AgentFiles/d
          key: ${{ steps.cache-key.outputs.key }}-${{ github.sha }}
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Windows-Editor-Base
          path: ${{ runner.temp }}/forge-work/AgentFiles/packages/*-FORGE-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
  package:
    needs: [core, editor, format, shared-game]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.windows_package && inputs.audit_source == '' && (inputs.package_source_run != '' || (needs.core.result == 'success' && needs.editor.result == 'success' && needs.format.result == 'success' && needs.shared-game.result == 'success')) && !inputs.hlsl_profile
    runs-on: windows-2022
    # Assembly plus the separate 600s SDK onboarding watchdog needs a full
    # acceptance allowance; a 10minute job cuts off that fixture prematurely.
    timeout-minutes: 30
    steps:
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install cmake==4.4.3 ninja==1.13.2
      - name: Verify reusable compiled-source provenance
        id: compiled
        shell: pwsh
        env:
          FORGE_REUSE_RUN: ${{ inputs.package_source_run }}
          FORGE_API_TOKEN: ${{ github.token }}
        run: |
          $run = if ($env:FORGE_REUSE_RUN) { $env:FORGE_REUSE_RUN } else { '${{ github.run_id }}' }
          if ($run -notmatch '^\d+$') { throw 'Invalid source run identifier' }
          $headers = @{ Authorization = "Bearer $env:FORGE_API_TOKEN"; Accept = 'application/vnd.github+json' }
          $base = '${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/' + $run
          $source = Invoke-RestMethod -Uri $base -Headers $headers
          $jobs = (Invoke-RestMethod -Uri "$base/jobs?per_page=100" -Headers $headers).jobs
          foreach ($name in @('core (ubuntu-22.04, core)', 'core (ubuntu-22.04, native-sdk)', 'core (windows-2022, core)', 'core (windows-2022, native-sdk)', 'editor', 'format', 'shared-game / build', 'shared-game / relocated')) {
            $job = @($jobs | Where-Object { $_.name -eq $name })
            if ($job.Count -ne 1 -or $job[0].conclusion -ne 'success') { throw "Source validation missing: $name" }
          }
          "sha=$($source.head_sha)" >> $env:GITHUB_OUTPUT
          "run=$run" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FORGE-Windows-Editor-Base
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/editor
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FORGE-Game-SDK-Windows
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/sdk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: FORGE-Shared-Game-Runtime-Kit
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/shared-game
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: FORGE-Reference-Game-Acceptance
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/reference-game
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: FORGE-Editor-SDK-Fixture
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/editor-sdk-fixture
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: FORGE-Editor-SDK-Project
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/editor-sdk-project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: FORGE-Standalone-Acceptance-Input
          run-id: ${{ steps.compiled.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/forge-package/game-fixture
      - name: Assemble and verify complete Windows package
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        env:
          FORGE_PACKAGE_ID: ${{ inputs.build_id }}
          FORGE_COMPILED_SOURCE: ${{ steps.compiled.outputs.sha }}
        run: |
          $name = "$env:FORGE_PACKAGE_ID-FORGE-Windows-x64.zip"
          $root = Join-Path $env:RUNNER_TEMP 'forge-package'
          # Build the editable C++ example against the exact installed SDK.
          tar -xzf "$root/sdk/experimental-native-sdk.tar.gz" -C "$root/sdk"
          if ($LASTEXITCODE) { throw 'Example SDK extraction failed' }
          cmake -S samples/projects/PhysicsLoads/Native -B "$root/loads-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DForgeNativeSdk_DIR=$root/sdk/sdk"
          if ($LASTEXITCODE) { throw 'C++ loads example configure failed' }
          cmake --build "$root/loads-build" --parallel 2
          if ($LASTEXITCODE) { throw 'C++ loads example compile failed' }
          cmake --install "$root/loads-build" --component GameplayRuntime --prefix "$root/loads-kits"
          if ($LASTEXITCODE) { throw 'C++ loads deployment failed' }
          Expand-Archive -LiteralPath "$root/editor/$name" -DestinationPath "$root/loads-editor"
          python tools/prepare_physics_loads.py --source samples/projects/PhysicsLoads --output "$root/loads-project" --runtime "$root/sdk/bin/forge_runtime.exe" --tools "$root/loads-editor/bin/forge_tools.exe" --module-kit "$root/loads-kits/project.gameplay"
          if ($LASTEXITCODE) { throw 'C++ loads example preparation failed' }
          python tests/physics_loads_example_test.py "$root/sdk/bin/forge_runtime.exe" "$root/loads-project"
          if ($LASTEXITCODE) { throw 'C++ loads runtime/recovery failed' }
          cmake -S samples/projects/PhysicsVelocity/Native -B "$root/velocity-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DForgeNativeSdk_DIR=$root/sdk/sdk"
          if ($LASTEXITCODE) { throw 'C++ velocity example configure failed' }
          cmake --build "$root/velocity-build" --parallel 2
          if ($LASTEXITCODE) { throw 'C++ velocity example compile failed' }
          cmake --install "$root/velocity-build" --component GameplayRuntime --prefix "$root/velocity-kits"
          if ($LASTEXITCODE) { throw 'C++ velocity deployment failed' }
          python tools/prepare_physics_loads.py --source samples/projects/PhysicsVelocity --output "$root/velocity-project" --runtime "$root/sdk/bin/forge_runtime.exe" --tools "$root/loads-editor/bin/forge_tools.exe" --module-kit "$root/velocity-kits/project.gameplay" --component project.velocity_control
          if ($LASTEXITCODE) { throw 'C++ velocity example preparation failed' }
          python tests/physics_velocity_example_test.py "$root/sdk/bin/forge_runtime.exe" "$root/velocity-project"
          if ($LASTEXITCODE) { throw 'C++ velocity runtime/recovery failed' }
          cmake -S samples/projects/PhysicsContacts/Native -B "$root/contacts-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DForgeNativeSdk_DIR=$root/sdk/sdk"
          if ($LASTEXITCODE) { throw 'C++ contacts example configure failed' }
          cmake --build "$root/contacts-build" --parallel 2
          if ($LASTEXITCODE) { throw 'C++ contacts example compile failed' }
          cmake --install "$root/contacts-build" --component GameplayRuntime --prefix "$root/contacts-kits"
          if ($LASTEXITCODE) { throw 'C++ contacts deployment failed' }
          python tools/prepare_physics_loads.py --source samples/projects/PhysicsContacts --output "$root/contacts-project" --runtime "$root/sdk/bin/forge_runtime.exe" --tools "$root/loads-editor/bin/forge_tools.exe" --module-kit "$root/contacts-kits/project.gameplay" --component project.contact_reaction
          if ($LASTEXITCODE) { throw 'C++ contacts example preparation failed' }
          python tests/physics_contacts_example_test.py "$root/sdk/bin/forge_runtime.exe" "$root/contacts-project"
          if ($LASTEXITCODE) { throw 'C++ contacts runtime/recovery failed' }
          cmake -S samples/projects/PhysicsVolumes/Native -B "$root/volumes-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DForgeNativeSdk_DIR=$root/sdk/sdk"
          if ($LASTEXITCODE) { throw 'C++ volumes example configure failed' }
          cmake --build "$root/volumes-build" --parallel 2
          if ($LASTEXITCODE) { throw 'C++ volumes example compile failed' }
          cmake --install "$root/volumes-build" --component GameplayRuntime --prefix "$root/volumes-kits"
          if ($LASTEXITCODE) { throw 'C++ volumes deployment failed' }
          python tools/prepare_physics_loads.py --source samples/projects/PhysicsVolumes --output "$root/volumes-project" --runtime "$root/sdk/bin/forge_runtime.exe" --tools "$root/loads-editor/bin/forge_tools.exe" --module-kit "$root/volumes-kits/project.gameplay" --component project.volume_probe
          if ($LASTEXITCODE) { throw 'C++ volumes example preparation failed' }
          python tests/physics_volumes_example_test.py "$root/sdk/bin/forge_runtime.exe" "$root/volumes-project"
          if ($LASTEXITCODE) { throw 'C++ volumes runtime/recovery failed' }
          cmake -S samples/projects/Movement2D/Native -B "$root/movement-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DForgeNativeSdk_DIR=$root/sdk/sdk"
          if ($LASTEXITCODE) { throw 'C++ 2D movement example configure failed' }
          cmake --build "$root/movement-build" --config Release
          if ($LASTEXITCODE) { throw 'C++ 2D movement example build failed' }
          cmake --install "$root/movement-build" --prefix "$root/movement-kits" --config Release
          if ($LASTEXITCODE) { throw 'C++ 2D movement example module kit failed' }
          python tools/prepare_physics_loads.py --source samples/projects/Movement2D --output "$root/movement-project" --runtime "$root/sdk/bin/forge_runtime.exe" --tools "$root/loads-editor/bin/forge_tools.exe" --module-kit "$root/movement-kits/project.gameplay" --component project.movement_2d --dependency forge.physics --dependency forge.input --import-source Assets/Sprites/SignalSheet.png --import-source Assets/Sprites/SignalSheet.material.json --import-source Assets/Physics2D/Solid.material.json --import-source Assets/Tiles/Directions.tileset.json --import-source Assets/Tiles/PaintedPlatforms.tilemap.json
          if ($LASTEXITCODE) { throw 'C++ 2D movement example preparation failed' }
          python tests/movement_2d_example_test.py "$root/sdk/bin/forge_runtime.exe" "$root/movement-project"
          if ($LASTEXITCODE) { throw 'C++ 2D movement input and both-host support failed' }
          cmake -S samples/projects/Character2D/Native -B "$root/character-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DForgeNativeSdk_DIR=$root/sdk/sdk"
          if ($LASTEXITCODE) { throw 'C++ 2D character example configure failed' }
          cmake --build "$root/character-build" --config Release
          if ($LASTEXITCODE) { throw 'C++ 2D character example build failed' }
          cmake --install "$root/character-build" --prefix "$root/character-kits" --config Release
          if ($LASTEXITCODE) { throw 'C++ 2D character example module kit failed' }
          python tools/prepare_physics_loads.py --source samples/projects/Character2D --output "$root/character-project" --runtime "$root/sdk/bin/forge_runtime.exe" --tools "$root/loads-editor/bin/forge_tools.exe" --module-kit "$root/character-kits/project.gameplay" --component project.character_movement_2d --dependency forge.physics --dependency forge.input --import-source Assets/Sprites/SignalSheet.png --import-source Assets/Sprites/SignalSheet.material.json --import-source Assets/Physics2D/Solid.material.json --import-source Assets/Tiles/Directions.tileset.json --import-source Assets/Tiles/PaintedPlatforms.tilemap.json
          if ($LASTEXITCODE) { throw 'C++ 2D character example preparation failed' }
          python tests/movement_2d_example_test.py "$root/sdk/bin/forge_runtime.exe" "$root/character-project"
          if ($LASTEXITCODE) { throw 'C++ 2D character input and both-host support failed' }
          python tools/assemble_windows_package.py --editor "$root/editor/$name" --sdk "$root/sdk/experimental-native-sdk.tar.gz" --output "$root/final/$name" --runtime-kit "$root/shared-game" --reference-game "$root/reference-game" --physics-loads "$root/loads-project" --physics-velocity "$root/velocity-project" --physics-contacts "$root/contacts-project" --physics-volumes "$root/volumes-project" --movement-2d "$root/movement-project" --character-2d "$root/character-project"
          if ($LASTEXITCODE) { throw 'Combined package assembly failed' }
          python tests/windows_combined_package_test.py "$root/final/$name" "$root/game-fixture/game/forge_game_fixture.exe" "$root/loads-evidence"
          if ($LASTEXITCODE) { throw 'Combined package relocation failed' }
      - name: Upload compiled physics example evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Physics-Loads-Example
          path: ${{ runner.temp }}/forge-package/loads-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Verify final package with editor SDK fixture and editable project
        # Run the editor fixture EXE (downloaded separately) against the
        # matching SDK extracted from the final ZIP and the dedicated
        # editable project (downloaded separately). Failure here gates
        # the FORGE-Windows-x64 upload on the next step.
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        env:
          FORGE_PACKAGE_ID: ${{ inputs.build_id }}
          FORGE_COMPILED_SOURCE: ${{ steps.compiled.outputs.sha }}
        run: |
          $name = "$env:FORGE_PACKAGE_ID-FORGE-Windows-x64.zip"
          $root = Join-Path $env:RUNNER_TEMP 'forge-package'
          $zip = Join-Path $root 'final' $name
          $fixture = Join-Path $root 'editor-sdk-fixture/forge_editor_fixture.exe'
          $project = Join-Path $root 'editor-sdk-project'
          $evidence = Join-Path $root 'editor-sdk-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          foreach ($required in @($zip, $fixture, $project)) {
            if (-not (Test-Path $required)) { throw "Missing editor SDK acceptance input: $required" }
          }
          # Diagnostic opt-in for the SDK acceptance run. The editor
          # and runtime open per-process bounded 256 KiB log files under
          # $evidence/sdk-diagnostic; the existing FORGE-Editor-SDK-Acceptance
          # artifact upload below picks this directory up automatically
          # because it lives under $evidence. Enabled for this acceptance
          # step only — production callers and the editor runtime never
          # inherit the env var.
          $env:FORGE_SDK_DIAGNOSTIC_DIR = Join-Path $evidence 'sdk-diagnostic'
          New-Item -ItemType Directory -Path $env:FORGE_SDK_DIAGNOSTIC_DIR -Force | Out-Null
          python tests/editor_sdk_package_test.py --zip $zip --fixture $fixture --project $project --evidence $evidence
          if ($LASTEXITCODE) { throw 'Editor SDK acceptance against final package failed' }
      - name: Upload editor SDK acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Editor-SDK-Acceptance
          path: ${{ runner.temp }}/forge-package/editor-sdk-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload complete Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Windows-x64
          path: ${{ runner.temp }}/forge-package/final/*-FORGE-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
  format:
    if: inputs.audit_source == '' && inputs.package_source_run == '' && !inputs.hlsl_profile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install clang-format==23.1.1
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
      - run: python tools/check_format.py
        working-directory: ${{ runner.os == 'Windows' && format('{0}/forge-work/FORGE', runner.temp) || github.workspace }}
