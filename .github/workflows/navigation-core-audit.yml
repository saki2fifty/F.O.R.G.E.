name: Windows navigation Debug diagnostics
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_commit:
        description: Immutable diagnostic source; never a package or full source gate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: navigation-debug-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  navigation:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      FORGE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      FORGE_BUILD_ID: unassigned
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - name: Checkout source without trailing-dot paths
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ inputs.source_commit }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          if ($env:FORGE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Full source SHA required' }
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - name: Build the two actual Debug navigation consumers
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          python -m pip install cmake==4.4.3 ninja==1.13.2
          if ($LASTEXITCODE) { throw 'Tools failed' }
          cmake --preset core -DFORGE_BUILD_MCP_EDITOR_TESTS=OFF -DFETCHCONTENT_BASE_DIR:PATH="${{ runner.temp }}/forge-work/AgentFiles/d" -DFORGE_BUILD_ID=unassigned -DFORGE_SOURCE_COMMIT="$env:FORGE_SOURCE_COMMIT"
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build --preset core --target forge_navigation_tests forge_navigation_link_gallery_tests forge_nav_build --parallel 2
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Validate split consumers with their original CTest limits
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: |
          $ErrorActionPreference = 'Stop'
          $output = '../AgentFiles/build/core/navigation-diagnostic'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          git rev-parse HEAD | Out-File "$output/source-commit.txt"
          cmake --version | Out-File "$output/cmake-version.txt"
          $expected = @('navigation', 'navigation_planar_assets', 'navigation_dynamic_obstacles', 'navigation_link_gallery', 'navigation_link_arc_gallery')
          $discovery = ctest --test-dir ../AgentFiles/build/core -R '^(navigation|navigation_planar_assets|navigation_dynamic_obstacles|navigation_link_gallery|navigation_link_arc_gallery)$' --show-only=json-v1
          $discovery | Out-File "$output/ctest-tests.json"
          if ($LASTEXITCODE -ne 0) { throw 'CTest discovery failed' }
          $tests = (($discovery -join "`n") | ConvertFrom-Json).tests
          if ($tests.Count -ne 5 -or (Compare-Object $expected $tests.name)) { throw 'Expected exactly five focused navigation tests' }
          ctest --test-dir ../AgentFiles/build/core -R '^(navigation|navigation_planar_assets|navigation_dynamic_obstacles|navigation_link_gallery|navigation_link_arc_gallery)$' --output-on-failure --no-tests=error
          $status = $LASTEXITCODE
          Copy-Item ../AgentFiles/build/core/Testing/Temporary/LastTest.log "$output/LastTest.log" -ErrorAction SilentlyContinue
          if ($status -ne 0) { throw 'Focused navigation CTest gate failed' }
      - name: Preserve exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Navigation-Debug-Diagnostic
          path: ${{ runner.temp }}/forge-work/AgentFiles/build/core/navigation-diagnostic
          if-no-files-found: warn
          retention-days: 14
