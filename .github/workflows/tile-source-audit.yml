name: Tile source Debug audit
on:
  workflow_call:
    inputs:
      source_commit:
        description: Immutable source to diagnose with the complete Debug source workload
        required: true
        type: string
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      FORGE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      FORGE_BUILD_ID: unassigned
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - name: Checkout source without trailing-dot paths
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ inputs.source_commit }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          if ($env:FORGE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Full source SHA required' }
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - name: Build only the actual source fixture
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          python -m pip install cmake==4.4.3 ninja==1.13.2
          if ($LASTEXITCODE) { throw 'Tools failed' }
          cmake --preset core
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build --preset core --target forge_tile_map_source_tests --parallel 2
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Measure complete source workload without the aggregate CTest cutoff
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        shell: pwsh
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & ../AgentFiles/build/core/forge_tile_map_source_tests.exe ../AgentFiles/build/core/tile-map-source-probe 2>&1 | Tee-Object ../AgentFiles/build/core/tile-source-probe.log
          if ($LASTEXITCODE) { throw 'Source fixture failed' }
          Write-Output "Complete Debug source fixture: $($timer.Elapsed.TotalSeconds) seconds"
      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORGE-Tile-Source-Debug
          path: ${{ runner.temp }}/forge-work/AgentFiles/build/core/tile-source-probe.log
          if-no-files-found: warn
          retention-days: 14
