name: Cache transport check
on:
  push:
    paths:
      - .github/workflows/cache-check.yml
      - tools/cache_workspace.cjs
  workflow_dispatch:
    inputs:
      pipe_probe:
        description: "Run the Windows pipe-contract probe (windows-pipe-probe.yml) via workflow_call. Skips the cache job."
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  cache:
    # Skip the cache transport check when the operator used the
    # pipe_probe dispatch input; that path runs the Windows
    # pipe-contract probe in the `pipe-probe` job below.
    if: github.event_name != 'workflow_dispatch' || !inputs.pipe_probe
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout Windows source without trailing-dot paths
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          FORGE_COMMIT: ${{ github.sha }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $source remote add origin https://github.com/${{ github.repository }}.git
          if ($LASTEXITCODE) { throw 'git remote failed' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:FORGE_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -C $source -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:FORGE_COMMIT
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - name: Prepare cache workspace path
        id: cache-workspace
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $preload = Join-Path $env:RUNNER_TEMP 'forge-work/FORGE/tools/cache_workspace.cjs'
          "preload=$($preload.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Create cache probe
        shell: pwsh
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'forge-work/AgentFiles/cache-probe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          Set-Content -LiteralPath "$probe/payload.txt" -Value 'FORGE cache transport'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: ${{ runner.temp }}/forge-work/AgentFiles/cache-probe
          key: forge-cache-probe-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove original probe
        shell: pwsh
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: Remove-Item -LiteralPath "${{ runner.temp }}/forge-work/AgentFiles/cache-probe" -Recurse -Force
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          NODE_OPTIONS: '--require "${{ steps.cache-workspace.outputs.preload }}"'
        with:
          path: ${{ runner.temp }}/forge-work/AgentFiles/cache-probe
          key: forge-cache-probe-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Verify restored probe
        shell: pwsh
        working-directory: ${{ runner.temp }}/forge-work/FORGE
        run: |
          $value = Get-Content -LiteralPath "${{ runner.temp }}/forge-work/AgentFiles/cache-probe/payload.txt"
          if ($value -ne 'FORGE cache transport') { throw 'Cache restore did not preserve the payload' }
  # Dispatch hook for the Windows pipe-contract probe. Runs ONLY when
  # the operator dispatched this workflow with `pipe_probe=true`;
  # otherwise the workflow behaves exactly as before. The probe lives
  # at .github/workflows/windows-pipe-probe.yml on the same branch
  # and is invoked via workflow_call so it does not need to be on the
  # default branch for `gh workflow run` to discover it.
  pipe-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.pipe_probe
    uses: ./.github/workflows/windows-pipe-probe.yml
